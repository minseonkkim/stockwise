version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  env_file: ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-trade}:${DB_PASSWORD:-trade_secret}@db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: trade_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: ${DB_USER:-trade}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trade_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trade} -d trade"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trade_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow DB 초기화 ────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: trade_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@trade.local || true
    restart: "no"

  # ── Airflow Webserver ────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: trade_airflow_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Airflow Scheduler ────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: trade_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI (Phase 5) ────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade_api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - ../src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker (Phase 5) ──────────────────────────────────
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade_celery_worker
    restart: unless-stopped
    env_file: ../.env
    command: celery -A src.tasks.pipeline worker --loglevel=info
    volumes:
      - ../data:/app/data
      - ../src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat / 스케줄러 (Phase 5) ────────────────────────
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade_celery_beat
    restart: unless-stopped
    env_file: ../.env
    command: celery -A src.tasks.pipeline beat --loglevel=info
    volumes:
      - ../data:/app/data
      - ../src:/app/src:ro
    depends_on:
      - celery-worker

volumes:
  postgres_data:
  airflow_logs:
